                - text: "**Start an existing container**: `docker restart [container]` **Stop an existing container**: `docker stop [container]` `sudo aa-remove-unknown(遇到permission denied)` ## Container linking (container networking) ### Network creation and joining **Create network**: - `docker network create -d bridge [网络桥名字]` - `docker network create -d overlay [网络隧道名]` **Join network**: - When creating a container: `docker run -itd --name [容器名] --network [网络名] [镜像名] [/bin/bash(终端环境)]` - Joining an existing container: `docker network connect [network_name] [container_name] ` ### Network DNS configuration The host's `/etc/docker/daemon.json` can configure the default DNS configuration for containers **View container DNS**: `docker run -it --rm [container] cat etc/resolv.conf` **Manually specify container DNS**: `docker run -it --rm -h [容器主机名] --dns=[dns_ip] --dns-search=test.com [container]` --- Parameters:"
