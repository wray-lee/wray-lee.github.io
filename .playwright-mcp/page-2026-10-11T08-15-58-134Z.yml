                - text: "**Remove image**: `docker rmi [镜像名]` ## Containers **View containers**: `docker ps -a` **Remove container**: `docker rm [容器名]` **Enter container**: `docker exec -it [容器序号/容器名字] /bin/bash` / `docker exec -it [容器序号] /bin/sh`"
