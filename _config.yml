# Hexo Configuration — Wray的Blog
# Docs: https://hexo.io/docs/configuration.html

# Site
title: 'Wray的Blog'
subtitle: '技术笔记与折腾记录'
description: 'Wray Lee 的技术笔记：折腾、备忘与学习记录'
keywords: [技术, 笔记, 折腾, 教程]
author: 'Wray Lee'
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
url: https://blog.wray7.top
root: /
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true
  trailing_html: true

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md
default_layout: post
titlecase: false
external_link:
  enable: true
  field: site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true
syntax_highlighter: highlight.js
highlight:
  enable: true
  auto_detect: false
  line_threshold: 0
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  enable: false

# Category & Tag
default_category: uncategorized
category_map:
tag_map:

# Date / Time format
date_format: YYYY-MM-DD
time_format: HH:mm:ss
updated_option: false

# Pagination
per_page: 12
pagination_dir: page

# Extensions
theme: reimu

# Deployment (not used — deploy is handled by bun scripts/deploy.ts)
deploy:
  type: ''

# Local search index
search:
  path: search.json
  field: post
  content: true
