# hexo-theme-reimu 配置（Wray的Blog）
# 主题默认配置见 node_modules/hexo-theme-reimu/_config.yml，这里只覆盖需要改的项

# 主菜单（去掉 friend，没有友链页）
menu:
  - name: home
    url: /
    icon:
  - name: archives
    url: /archives
    icon:
  - name: about
    url: /about
    icon:

# 头像：source/_data/avatar/avatar.png（由主题 generator 发布到 /avatar/）
avatar: "avatar.png"

# 社交链接（侧边栏）
social:
  github: https://github.com/wray-lee

# 页脚
footer:
  since: 2019
  powered: true
  count: true
  busuanzi: true

# 本地搜索：读取 hexo-generator-searchdb 生成的 search.json
generator_search:
  enable: true
  field: post
  content: true

# 多语言 i18n（主题内置实现，见 reimu README i18n 章节）：默认 zh-CN；en/ja 文章通过 front-matter lang 生成 /en/、/ja/ 路由
i18n:
  enable: true，避免生成中文内容的日英马甲页；回填完成后改回 true
  type: [page, post]
  generator: [archive, category, tag, index]
  languages: [zh-CN, en, ja]

# 全随机 banner：dmoe.cc 动漫壁纸随机接口，每次加载返回一张不同的图
# 主题所有装饰性图片位（首页头图、文章导航、归档页、默认封面）都走这个配置
banner: "https://www.dmoe.cc/random.php"
