# hexo-theme-reimu 配置（Wray的Blog）
# 主题默认配置见 node_modules/hexo-theme-reimu/_config.yml，这里只覆盖需要改的项

# 主菜单（去掉 friend，没有友链页）
menu:
  - name: home
    url: /
    icon:
  - name: archives
    url: /archives
    icon:
  - name: about
    url: /about
    icon:

# 头像：source/_data/avatar/avatar.png（由主题 generator 发布到 /avatar/）
avatar: "avatar.png"

# 社交链接（侧边栏）
social:
  github: https://github.com/wray-lee

# 页脚
footer:
  since: 2019
  powered: true
  count: true
  busuanzi: true

# 本地搜索：读取 hexo-generator-searchdb 生成的 search.json
generator_search:
  enable: true
  field: post
  content: true

# 多语言 i18n（主题内置实现，见 reimu README i18n 章节）：默认 zh-CN；en/ja 文章通过 front-matter lang 生成 /en/、/ja/ 路由
i18n:
  enable: true
  type: [page, post]
  generator: [archive, category, tag, index]
  languages: [zh-CN, en, ja]

# banner 用主题自带默认图（灵梦）作占位与失败回退；页面加载后在线换成随机东方图
# scripts/fix-banner-fallback.js 给这些 <img> 打标记，source/js/banner-gallery.js 每次加载从 paulzzh 东方随机图 API 取图替换
banner: "/images/banner.webp"

# 主题在手机宽度（≤479px）只显示当前页码；补显最后一页（紧挨"下一页"的那个），呈现为"5 / 22"
injector:
  head_end: |
    <style>
    @media screen and (max-width: 479px) {
      #page-nav .page-number:has(+ .next) { display: inline-block; }
      #page-nav .page-number:has(+ .next)::before { content: "/ "; }
    }
    </style>
